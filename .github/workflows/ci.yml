name: OpenRV

on:
  workflow_dispatch:
    inputs:
      SKIP_DEPS_CACHE:
        description: 'Skip dependencies caching'
        required: true
        default: 'false'
  push:
    tags:
      - 'v*.*.*'

env:
  SKIP_DEPS_CACHE: 'false'

jobs:

  windows:
    name: 'Windows ${{ matrix.vfx-platform }}
      <${{ matrix.os }}
       msvc=${{ matrix.msvc-component }},
       qt=${{ matrix.qt-version }},
       python=${{ matrix.python-version }},
       cmake=${{ matrix.cmake-version }},
       arch=${{ matrix.arch-type }},
       config=${{ matrix.build-type }}>'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "windows-2022"
            arch-type: "x86_64"
            build-type: "Release"
            qt-version: "5.15.2"
            python-version: "3.10"
            cmake-version: "3.31.6"
            vfx-platform: "CY2023"
            msvc-component: "14.40.17.10.x86.x64"
            msvc-compiler: "14.40.33807"

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check if it is a schedule job
        if: github.event_name == 'schedule'
        run: |
          echo "SKIP_DEPS_CACHE='true'" >> $GITHUB_ENV

      - name: Check out repository code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # 4.1.7
        with:
          submodules: recursive

      - name: Install MSVC components ${{ matrix.msvc-component }}
        run: |
          Set-Location "C:\Program Files (x86)\Microsoft Visual Studio\Installer\"
          $InstallPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $componentsToRemove= @(
            "Microsoft.VisualStudio.Component.VC.${{ matrix.msvc-component }}"
            "Microsoft.VisualStudio.Component.VC.${{ matrix.msvc-component }}.Spectre"
          )
          [string]$workloadArgs = $componentsToRemove | ForEach-Object {" --add " +  $_}
          $Arguments = ('/c', "vs_installer.exe", 'modify', '--installPath', "`"$InstallPath`"",$workloadArgs, '--quiet', '--norestart', '--nocache')
          # should be run twice
          $process = Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden
          $process = Start-Process -FilePath cmd.exe -ArgumentList $Arguments -Wait -PassThru -WindowStyle Hidden

      - name: Set up MSVC ${{ matrix.msvc-compiler }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: ${{ matrix.msvc-compiler }}
          arch: '${{ matrix.arch-type }}'

      - name: Setup msys2 and install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # False because it keep creating new cache entry.
          cache: false
          install: >-
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-cmake-cmcldeps
            mingw-w64-x86_64-glew
            mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-make
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-toolchain
            autoconf
            automake
            bison
            flex
            git
            libtool
            nasm
            p7zip
            patch
            unzip
            zip

      - name: Activate Python ${{ matrix.python-version }}
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # 5.2.0
        with:
          python-version: '${{ matrix.python-version }}'

      - name: Display Python installation location
        run: |
          python -c "import sys; print(sys.executable)"

      - name: Cache CMake for Windows
        uses: actions/cache@v4
        id: windows-cmake-cache
        with:
          path: "C:/Program Files/CMake"
          key: ${{ runner.os }}-cmake-${{ matrix.cmake-version }}

      - name: Install CMake ${{ matrix.cmake-version }} with chocolatey
        if: steps.windows-cmake-cache.outputs.cache-hit != 'true'
        run: |
          choco install cmake --force --version=${{ matrix.cmake-version }} --allow-downgrade

      - name: Set PATH environment variable
        run: |
          # Put the setup-python interpreter first so python3 is not msys2's mingw64 Python (no pip).
          echo "export PATH=\"/c/Program Files/CMake/bin:$(cygpath -u "$pythonLocation"):/c/msys64/mingw64/bin:$PATH:/c/Strawberry/c/bin:/c/Strawberry/perl/site/bin:/c/Strawberry/perl/bin\"" >> ~/.bash_profile
        shell: msys2 {0}

      - name: Set ACLOCAL_PATH environment variable
        run: |
          echo "export ACLOCAL_PATH=/c/msys64/usr/share/aclocal" >> ~/.bash_profile
        shell: msys2 {0}

      - name: Display environment variables
        run: |
          echo $PATH
          echo $ACLOCAL_PATH
          which python
          which python3
          which cmake
        shell: msys2 {0}

      - name: Prepare Qt folder
        run: |
          mkdir -p /c/qt
        shell: msys2 {0}

      - name: Install Qt ${{ matrix.qt-version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: '${{ matrix.qt-version }}'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: "c:/"
          install-deps: 'false'
          modules: 'debug_info qtcharts qtdatavis3d qtlottie qtnetworkauth qtquick3d qtquicktimeline qtscript qtwebengine qtwebglplugin'
          archives: 'd3dcompiler_47 opengl32sw qt3d qtactiveqt qtbase qtconnectivity qtdeclarative qtgraphicaleffects qtimageformats qtlocation qtmultimedia qtquickcontrols qtquickcontrols2 qtremoteobjects qtscxml qtsensors qtsvg qttools qttranslations qtwebchannel qtwebsockets qtwebview qtwinextras qtxmlpatterns'
          # Caching only save 2 minutes. Keep the cache for longer operations.
          cache: false
          setup-python: 'false'
          tools: 'tools_qtcreator'
          set-env: 'true'
          tools-only: 'false'
          aqtversion: '==3.2.*'

      # Not --user: RV's own Python 3.10 reads the same user site, and pip would check these
      # build tools against RV's pinned packages.
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade -r ./requirements.txt
        shell: msys2 {0}

      - name: Check if the dependencies changed
        if: matrix.build-type == 'Release'
        uses: dorny/paths-filter@v3
        id: changes-in-deps
        with:
          filters: |
            dependencies:
              - 'cmake/**'

      - name: Restore some dependencies
        # Restore only if there are no changes under cmake folder and Release build.
        if: env.SKIP_DEPS_CACHE == 'false' && steps.changes-in-deps.outputs.dependencies == 'false' && matrix.build-type == 'Release'
        id: cmake-dependencies
        uses: actions/cache@v4
        with:
          path: |
            ./_build/RV_DEPS_*
            ./_build/cmake/dependencies
            ./_build/_deps
          key: windows-dependencies

      # Build output also goes to _logs/, so a failure can be reported as annotations (see below).
      - name: Configure OpenRV
        run: |
          set -o pipefail
          mkdir -p _logs
          cmake --version
          export QT_HOME=c:/Qt/${{ matrix.qt-version }}/msvc2019_64
          cmake -B _build -G "Visual Studio 17 2022" -A x64 -DRV_DEPS_WIN_PERL_ROOT=c:/Strawberry/perl/bin -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DRV_DEPS_QT5_LOCATION=$QT_HOME -DRV_VFX_PLATFORM=${{ matrix.vfx-platform }} -DRV_FFMPEG_NON_FREE_DECODERS_TO_ENABLE="aac;aac_at;aac_fixed;aac_latm;bink;binkaudio_dct;binkaudio_rdft;dnxhd;dvvideo;prores;qtrle;vp9;vp9_cuvid;vp9_mediacodec;vp9_qsv;vp9_rkmpp;vp9_v4l2m2m" -DRV_FFMPEG_NON_FREE_ENCODERS_TO_ENABLE="aac;aac_mf;dnxhd;dvvideo;prores;qtrle;vp9_qsv;vp9_vaapi" -DRV_DEPS_BMD_DECKLINK_SDK_ZIP_PATH='D:/a/OpenRV/OpenRV/third-party/Blackmagic_DeckLink_SDK_14.1.zip' 2>&1 | tee _logs/configure.log
        shell: msys2 {0}

      - name: Build OpenRV dependencies
        if: steps.cmake-dependencies.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          cmake --build _build --config ${{ matrix.build-type }} --target dependencies --parallel=$(python -c 'import os; print(os.cpu_count())') -v 2>&1 | tee _logs/dependencies.log
        shell: msys2 {0}
        id: build_deps

      - name: Build OpenRV main executable
        run: |
          set -o pipefail
          cmake --build _build --config ${{ matrix.build-type }} --target main_executable --parallel=$(python -c 'import os; print(os.cpu_count())') -v 2>&1 | tee _logs/main_executable.log
        shell: msys2 {0}

      - name: Tests
        continue-on-error: true
        run: |
          ls -al _build/stage/app/bin
          ctest --test-dir _build -C ${{ matrix.build-type }} --extra-verbose
        shell: msys2 {0}

      - name: Install OpenRV
        run: |
          set -o pipefail
          cmake --install _build --prefix $(pwd)/_install --config ${{ matrix.build-type }} 2>&1 | tee _logs/install.log
        shell: msys2 {0}

      # pwsh, not msys2, to run with a plain Windows environment as on a workstation.
      # OIIO_LOAD_DLLS_FROM_PATH=0: the DLLs must resolve from RV's bin, not from the runner's PATH.
      - name: Smoke test the OpenImageIO Python module
        run: |
          $env:QT_QPA_PLATFORM = "minimal"
          $env:OIIO_LOAD_DLLS_FROM_PATH = "0"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          & "$PWD/_install/bin/py-interp.exe" src/build/oiio_python_smoke.py "$PWD/_install" | Tee-Object -FilePath _logs/smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      # The studio proxy blocks the blob storage that serves job logs; annotations come through
      # api.github.com (`gh api repos/<repo>/check-runs/<job id>/annotations`).
      - name: Report the failing log as annotations
        if: failure()
        run: |
          set +e +o pipefail
          log=$(ls -t _logs/*.log 2>/dev/null | head -n 1)
          [ -n "$log" ] || exit 0
          # GitHub keeps at most 10 error annotations per step and 4096 characters per annotation.
          { echo "== error lines"; grep -E -A8 '(error|ERROR)( [A-Z]+[0-9]+)? ?:|CMake Error|FAILED|Traceback|requires .*(incompatible|not installed)' "$log" | head -n 60
            echo "== last lines"; tail -n 80 "$log"; } | cut -c1-300 | tr -d '\r' |
            awk -v title="$(basename "$log")" '
              { gsub(/%/, "%25"); line = $0 "%0A" }
              length(msg) + length(line) > 4000 { print "::error title=" title " " ++n "::" msg; msg = ""; if (n == 10) exit }
              { msg = msg line }
              END { if (msg != "" && n < 10) print "::error title=" title " " ++n "::" msg }'
        shell: msys2 {0}

      - name: Get the release file name
        run: |
          echo "OPENRV_RELEASE_FILENAME=OpenRV_${{  github.ref_name }}_$(git rev-parse --short HEAD)_${{ matrix.os }}_${{ matrix.arch-type }}_${{ matrix.vfx-platform }}_${{ matrix.build-type }}" >> $GITHUB_ENV
        shell: msys2 {0}

      - name: Create zip file of OpenRV installation
        run: |
          zip -r ${{ env.OPENRV_RELEASE_FILENAME }}.zip _install/
        shell: msys2 {0}

      - name: Upload OpenRV artifact file
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OPENRV_RELEASE_FILENAME }}
          path: ${{ env.OPENRV_RELEASE_FILENAME }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ env.OPENRV_RELEASE_FILENAME }}.zip
          allowUpdates: true
          makeLatest: true
